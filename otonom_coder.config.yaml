# otonom_coder.config.yaml

# Varsayılan çalışma modu:
# - "cloud"  → qwen3-coder:480b-cloud
# - "local"  → yerel coder modelin (örn. qwen2.5-coder)
mode: cloud

cloud:
  host: "http://localhost:11434"
  model: "qwen3-coder:480b-cloud"

local:
  host: "http://localhost:11434"
  model: "qwen2.5-coder:32b"

general:
  # Web UI'de boş bırakılırsa kullanılacak workspace
  default_workspace: "./workspace"

  # LLM ayarları
  temperature: 0.1

  # max_rounds:
  #   1  → sadece direkt "dosya aksiyonu üret"
  #   2+ → önce PLAN, sonra kod (plan → apply)
  max_rounds: 2

  # Agent bağlamı için:
  max_files_in_tree: 150            # LLM'e göstereceğimiz max dosya sayısı
  max_preview_bytes_per_file: 2000  # (şimdilik kullanılmıyor)

  # Varsayılan davranış: gerçek dosya yaz / sadece simülasyon
  dry_run_default: false

  # Test ayarları:
  run_tests_default: true
  test_command: "pytest"
  max_test_fix_rounds: 1
  test_timeout_seconds: 300

  # Format ayarları:
  run_format_default: true
  format_command: "black ."

  # Lint ayarları:
  run_lint_default: false
  lint_command: "ruff ."

  # Otomatik paket yükleme:
  # Test çıktısında "ModuleNotFoundError: No module named 'X'" görürse
  # - workspace içinde 'X' diye klasör yoksa
  # - auto_install_missing_packages_default true ise
  # aşağıdaki komutu çalıştırır:
  #   pip_install_command.format(package="X")
  auto_install_missing_packages_default: true
  pip_install_command: "pip install {package}"
  max_rounds: 1

  # Agent bağlamı için:
  max_files_in_tree: 150      # LLM'e göstereceğimiz max dosya sayısı
  max_preview_bytes_per_file: 2000  # İstersek ileride içerik de ekleriz (şimdilik kullanılmıyor)

  # Varsayılan davranış: gerçek dosya yaz / sadece simülasyon
  dry_run_default: false
