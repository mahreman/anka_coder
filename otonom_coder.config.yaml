# otonom_coder.config.yaml

# Varsayılan çalışma modu:
# - "cloud"  → qwen3-coder:480b-cloud
# - "local"  → yerel coder modelin (örn. qwen2.5-coder)
mode: cloud

cloud:
  host: "http://localhost:11434"
  model: "qwen3-coder:480b-cloud"

local:
  host: "http://localhost:11434"
  model: "qwen2.5-coder:32b"

general:
  # Web UI'de boş bırakılırsa kullanılacak workspace
  default_workspace: "./workspace"

  # LLM ayarları
  temperature: 0.1
  max_rounds: 1

  # Agent bağlamı için:
  max_files_in_tree: 150      # LLM'e göstereceğimiz max dosya sayısı
  max_preview_bytes_per_file: 2000  # İstersek ileride içerik de ekleriz (şimdilik kullanılmıyor)

  # Varsayılan davranış: gerçek dosya yaz / sadece simülasyon
  dry_run_default: false
